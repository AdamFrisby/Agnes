name: Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '30 5 * * 1'
  workflow_dispatch: {}

permissions: {}

jobs:
  dependency-review:
    name: dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@e7aeea1772ec01da74cafda11c5caa463520ca59 # v3
        with:
          fail-on-severity: moderate

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - uses: github/codeql-action/init@24c7eb380a2dc368f2d129e4c65e51d172983a1e # v4
        with:
          languages: csharp
          queries: security-extended
      - run: dotnet build Agnes.Core.slnf --configuration Release
      - uses: github/codeql-action/analyze@24c7eb380a2dc368f2d129e4c65e51d172983a1e # v4

  security-scans:
    name: secrets, workflow, and filesystem security
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan committed history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4e5d619bb0c9f2117567b7f10696f901dd # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Audit GitHub Actions workflows
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          inputs: .github/workflows
          collect: workflows
          online-audits: false
          persona: regular
          min-severity: low
          min-confidence: medium
          version: v1.29.0
          advanced-security: false
          annotations: true
      - name: Scan filesystem dependencies, misconfiguration, and secrets
        run: >-
          docker run --rm
          --mount type=bind,source="$GITHUB_WORKSPACE",target=/src,readonly
          --workdir /src
          aquasec/trivy@sha256:16f1ee8462d0ba07dd69239150d60ba7b591c55e02dfc33a3fc19710b861d180
          fs --scanners vuln,misconfig,secret --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 .

  container-security:
    name: container security
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: host
            dockerfile: Dockerfile
            image: agnes-host-security
          - name: relay
            dockerfile: src/Agnes.Relay/Dockerfile
            image: agnes-relay-security
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the production image
        run: docker build --file ${{ matrix.dockerfile }} --tag ${{ matrix.image }}:${{ github.sha }} .
      - name: Export image without exposing the Docker socket to the scanner
        run: docker save ${{ matrix.image }}:${{ github.sha }} --output /tmp/${{ matrix.name }}-security.tar
      - name: Scan the production image
        run: >-
          docker run --rm
          --mount type=bind,source=/tmp,target=/scan,readonly
          aquasec/trivy@sha256:16f1ee8462d0ba07dd69239150d60ba7b591c55e02dfc33a3fc19710b861d180
          image --input /scan/${{ matrix.name }}-security.tar --scanners vuln,secret --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1
