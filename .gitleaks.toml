title = "Agnes Gitleaks policy"

[extend]
useDefault = true

# These are test/UI literals, not credentials. Exceptions deliberately match the full fixed value.
[allowlist]
description = "Exact non-secret fixture and keyboard-binding literals"
regexTarget = "match"
regexes = [
  '''token = "9f3a1c7e-b204-4d55-a1e8-6c0f2b9d7e31"''',
  '''KeyBinding Gesture="Ctrl\+Shift\+Tab"''',
]
paths = [
  '''src/Agnes\.App\.Desktop/Assets/Keymaps/[^/]+\.json''',
  '''tests/Agnes\.Desktop\.Tests/KeymapTests\.cs''',
]
